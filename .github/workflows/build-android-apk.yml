name: Build Android APK

on:
  push:
    paths:
      - "AndroidApp/**"
      - "ChanKhongIOS/ChanKhong/WebContent/**"
      - ".github/scripts/reassemble-pdfs.sh"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore lesson PDFs
        run: bash .github/scripts/reassemble-pdfs.sh

      - name: Create temporary Android debug signing key
        run: >-
          keytool -genkeypair -v
          -keystore "$RUNNER_TEMP/tc-debug.keystore"
          -storepass android
          -alias androiddebugkey
          -keypass android
          -keyalg RSA
          -keysize 2048
          -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: >-
          gradle --no-daemon -p AndroidApp
          "-PtcDebugKeystore=$RUNNER_TEMP/tc-debug.keystore"
          assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TC-Vacuum-Study-APK
          path: AndroidApp/app/build-output/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
